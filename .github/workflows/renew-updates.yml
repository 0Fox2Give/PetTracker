name: Renew update feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: write
concurrency:
  group: pet-tracker-publishing
  cancel-in-progress: false
jobs:
  renew:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build publisher tools
        shell: pwsh
        run: dotnet build tools/ReleaseTools/ReleaseTools.csproj -c Release --nologo
      - name: Authenticate and renew feeds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PET_TRACKER_SIGNING_KEY: ${{ secrets.PET_TRACKER_SIGNING_KEY }}
        run: ./tools/Renew-GitHubFeeds.ps1 -Repository $env:GITHUB_REPOSITORY
